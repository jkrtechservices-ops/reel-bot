name: reel
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to YouTube after making the reel (true or false)"
        default: "true"
      privacy:
        description: "private, unlisted or public"
        default: "private"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pick next script
        id: pick
        run: |
          NEXT=$(ls queue 2>/dev/null | grep -E '^[0-9]+$' | sort -n | head -1)
          if [ -z "$NEXT" ]; then
            echo "Queue is empty. Add scripts to inbox.txt"
            exit 1
          fi
          echo "num=$NEXT" >> $GITHUB_OUTPUT
          echo "Using script $NEXT"
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo apt-get install -y fonts-montserrat || true
      - run: pip install "moviepy==1.0.3" "pillow==9.5.0" "numpy<2" requests faster-whisper
      - run: python make_reel.py ${{ steps.pick.outputs.num }}
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/reel.mp4
      - name: Upload to YouTube
        if: ${{ github.event.inputs.upload != 'false' }}
        run: python upload_youtube.py out/reel.mp4 queue/${{ steps.pick.outputs.num }}/script.json "${{ github.event.inputs.privacy || 'private' }}"
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      - name: Remove used script
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git rm -r -q queue/${{ steps.pick.outputs.num }}
          git commit -m "Used script ${{ steps.pick.outputs.num }}"
          git pull --rebase || true
          git push
