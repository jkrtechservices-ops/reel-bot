name: reel
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "moviepy==1.0.3" "pillow==9.5.0" "numpy<2" requests faster-whisper
      - run: python make_reel.py
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/reel.mp4
